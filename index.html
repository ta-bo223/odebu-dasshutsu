const Core = (()=>{

const photo=x=>x===undefined||x===null||(typeof x==='string'&&x.length<=80000&&/^data:image\/jpeg;base64,[A-Za-z0-9+/]+={0,2}$/.test(x));

function food(m){return m&&id(m.id)&&str(m.name,100)&&str(m.amount,60)&&finite(m.kcal,0,5000)&&['p','f','c'].every(k=>m[k]===null||finite(m[k],0,1000));}
function validate(s){if(!s||s.version!==1||!(s.profile===null||profile(s.profile)))throw Error('基本設定の形式が違います。');for(const k of ['meals','weights','workouts','favorites'])if(!Array.isArray(s[k])||s[k].length>10000)throw Error('記録の形式・件数が範囲外です。');if(!s.meals.every(meal)||!s.favorites.every(food)||!s.weights.every(w=>w&&date(w.date)&&finite(w.value,35,250))||!s.workouts.every(w=>w&&id(w.id)&&date(w.date)&&str(w.title,300)&&str(w.detail,3000)))throw Error('記録に不正な値があります。');for(const k of ['meals','favorites','workouts'])if(new Set(s[k].map(x=>x.id)).size!==s[k].length)throw Error('記録IDが重複しています。');if(new Set(s.weights.map(x=>x.date)).size!==s.weights.length)throw Error('体重の日付が重複しています。');return s;}
function migrate(input){const s=JSON.parse(JSON.stringify(validate(input)));const map={'朝食':'1食目','昼食':'2食目','夕食':'3食目','間食':'4食目'};s.meals.forEach(m=>{if(map[m.slot]){m.previousSlot=m.slot;m.slot=map[m.slot];}});return s;}
function mealTotals(ms){return slots.map(slot=>({slot,...total(ms.filter(m=>m.slot===slot)),count:ms.filter(m=>m.slot===slot).length}));}
function targets(p,weight){if(!profile(p))return null;const w=weight||p.weight,bmi=w/((p.height/100)**2),tb=p.target/((p.height/100)**2);if(p.special||bmi<18.5||tb<18.5)return {blocked:true,reason:'この設定では自動の栄養目標を出しません。記録は使えます。医師・管理栄養士と目標を相談してください。'};const ree=9.99*w+6.25*p.height-4.92*p.age+(p.sex==='m'?166:0)-161;const tdee=ree*p.activity;const reached=(p.goal==='lose'&&w<=p.target)||(p.goal==='gain'&&w>=p.target);const effectiveGoal=reached?'maintain':p.goal;let kcal=Math.round(tdee*({lose:.9,gain:1.05,maintain:1}[effectiveGoal])/10)*10;kcal=Math.max(kcal,Math.ceil(Math.max(1500,ree)/10)*10);return {kcal,reached,effectiveGoal,p:Math.round(kcal*.25/4),f:Math.round(kcal*.3/9),c:Math.round(kcal*.45/4),ree:Math.round(ree),tdee:Math.round(tdee)};}

function training(p,session=0){
 if(!p)return {blocked:true,reason:'基本設定を保存すると、メニューが表示されます。'};
 if(p.pain||p.special)return {blocked:true,reason:'痛み・ケガや運動上の制限があるため、自動メニューを停止しています。医療者に相談してください。'};
 const gym=p.place==='gym',variant=((session%3)+3)%3;
 const home=[
  [['椅子スクワット','動かない椅子を壁につけ、ゆっくり座って立つ。'],['壁腕立て','壁に手をつき、体をまっすぐに保って曲げ伸ばし。'],['ヒップリフト','仰向けで膝を曲げ、お尻を上げる。腰を反らさない。'],['うつ伏せWレイズ','肘をW字にし、肩をすくめず肩甲骨を軽く寄せる。'],['カーフレイズ','支えにつかまり、かかとをゆっくり上げ下げ。']],
  [['椅子スクワット（ゆっくり）','椅子を壁につけ、3秒ほどかけて座る。立つ時は反動を使わない。'],['壁腕立て','壁に手をつき、肩をすくめず無理のない範囲で。'],['うつ伏せWレイズ','肘をW字にし、首を反らさず肩甲骨を軽く寄せる。'],['バードドッグ','四つんばいから対角の手足を低く伸ばす。体をひねらず左右交互に。','左右各5〜8回'],['横向き脚上げ','横向きに寝て、上の脚をゆっくり上げ下げ。骨盤を倒さない。','左右各8〜12回']],
  [['ヒップリフト','お尻を上げた所で1秒止め、ゆっくり下ろす。腰を反らさない。'],['壁腕立て（ゆっくり）','3秒ほどかけて壁に近づき、息を止めずに押し戻す。'],['椅子スクワット','壁につけた椅子へ静かに座る。膝とつま先を同じ向きに。'],['うつ伏せWレイズ','肩甲骨を軽く寄せて1秒止める。肩や腰に痛みがあれば中止。'],['仰向けかかと滑らせ','仰向けで膝を曲げ、片脚ずつかかとを床に沿って滑らせる。腰を反らさない。','左右各5〜8回']]
 ];

  [['レッグプレス','背中をパッドにつけ、膝を伸ばし切らない。'],['チェストプレス','肩をすくめず、軽い重量で押す。'],['シーテッドロー','反動を使わず、肘を後ろへ引く。'],['レッグカール','股関節を浮かせず、ゆっくり曲げる。'],['カーフレイズ','支えにつかまり、かかとをゆっくり上げ下げ。']],
  [['レッグプレス','無理のない深さで、ゆっくり押し戻す。'],['ラットプルダウン','バーは首の後ろへ引かず、胸の前へ。体を大きく反らさない。'],['チェストプレス','軽い重量で、肩が痛まない範囲で押す。'],['ヒップアブダクション','上体を安定させ、反動を使わず脚を開く。'],['バードドッグ','マットで四つんばい。対角の手足を低く伸ばし、体をひねらない。','左右各5〜8回']],
  [['レッグカール','上体を安定させ、ゆっくり膝を曲げる。'],['チェストプレス','押し戻す時も反動を使わず、息を止めない。'],['シーテッドロー','肩をすくめずに引き、ゆっくり戻す。'],['レッグエクステンション','スタッフにシートを調整してもらい、膝を勢いよく伸ばし切らない。'],['カーフレイズ','支えにつかまり、反動を使わず上げ下げ。']]
 ];
 let list=(gym?machines:home)[variant];
 if(p.minutes<=10)list=list.slice(0,3);else if(p.minutes===15)list=list.slice(0,4);
 const sets=p.minutes<=20?1:p.minutes===30?2:(p.goal==='gain'&&p.level==='experienced'?3:2);
 return {blocked:false,variant,label:['A・基本','B・安定','C・コントロール'][variant],list:list.map(([name,cue,reps])=>({name,cue,sets,reps:reps||'8〜12回',rest:'60〜120秒'})),days:p.days===1?['月']:p.days===2?['月','木']:['月','水','金'],walkDays:['火','木','土','日'].slice(0,Math.max(0,p.days-3)),note:p.goal==='gain'?'回数を安定してこなせてから、少しずつ負荷を増やす。':p.goal==='lose'?'減量中も筋力を保つ。食事の帳尻合わせとして運動を増やさない。':'続けやすい負荷で、全身を定期的に動かす。'};
}
function addDays(d,n){const t=new Date(d+'T12:00:00Z');t.setUTCDate(t.getUTCDate()+n);return t.toISOString().slice(0,10);}
function nextTraining(p,workouts,now){
 const dates=[...new Set(workouts.filter(w=>w.date<=now).map(w=>w.date))].sort();
 const plan=training(p,dates.length);if(plan.blocked)return plan;

 let scheduled=now;
 if(last){scheduled=addDays(last,2);const names=['日','月','火','水','木','金','土'];while(!plan.days.includes(names[new Date(scheduled+'T12:00:00Z').getUTCDay()]))scheduled=addDays(scheduled,1);}

const KEY='karada-note-v1';let state=Core.empty(),storageOK=true,corrupt=false,tab='home',day=today(),editId=null;
function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Math.round(n).toLocaleString('ja-JP'),uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
try{const raw=localStorage.getItem(KEY);if(raw)state=Core.migrate(JSON.parse(raw));localStorage.setItem(KEY+'-probe','1');localStorage.removeItem(KEY+'-probe');}catch(e){storageOK=false;corrupt=true;}

function adviceCard(){const p=state.profile;if(!p)return '';const w=weightAt(),t=target(),plan=Core.training(p);const remaining=Math.abs(w-p.target).toFixed(1),strength=Math.min(40,p.minutes),walk=Math.min(30,p.minutes),extra=Math.min(10,Math.max(0,p.minutes-strength)),walkDays=plan.walkDays?.length||0,weekly=walk*walkDays+extra*(plan.days?.length||0);let relation=p.goal==='maintain'?'現在の体重を維持する設定です。目標体重に近づけたい場合は、減量または筋肉を増やす設定を選んでください。':t?.reached?'目標体重に到達したため、食事の目安を維持用に切り替えています。体重は日々変動するので、経過も確認してください。':`目標まで ${remaining} kg。差が大きくても、急激な食事制限や運動量の増加は提案しません。`;

 $('view').innerHTML=`<div class="title-line"><span class="muted">1食ごとに、料理を4品までまとめて入力。</span>${dateInput()}</div><p class="hint" style="margin-bottom:22px">食べた料理だけ入力してください。空欄の品・食事は保存しません。各料理の量とカロリーを入れると、1食分と1日分を合計します。</p>${m?`<section class="card"><h2 class="section-title">${esc(m.slot)}の記録を編集</h2>${mealForm(m)}</section>`:''}<form id="five-meals">${Core.slots.map((slot,i)=>{const rows=ms.filter(x=>x.slot===slot);return `<section class="card" id="meal-section-${i}"><div class="flex section-title"><h2>${slot}</h2><span class="pill" id="slot-total-${i}"></span></div>${rows.map(x=>`<div class="meal"><div><div class="meal-name">${esc(x.name)}</div><small>${esc(x.amount)} / ${fmt(x.kcal)} kcal</small>${x.photo?`<img src="${esc(x.photo)}" alt="${esc(x.name)}の写真" style="display:block;width:140px;max-width:100%;border-radius:12px;margin-top:8px"><button type="button" class="tiny ghost" data-remove-photo="${x.id}">写真だけ削除</button>`:''}</div><div class="row"><button type="button" class="tiny ghost" data-edit="${x.id}">編集</button><button type="button" class="tiny danger" data-delete-meal="${x.id}">削除</button></div></div>`).join('')}${[0,1,2,3].map(j=>dishForm(i,j,draft)).join('')}</section>`;}).join('')}<section class="card green"><h2>1食目〜5食目の合計</h2><div id="five-total" class="spaced"></div><button type="submit" class="full spaced">入力した料理をまとめて保存</button><p class="sub">合計は保存済み＋入力中の分。量は単位が違うため合算せず、カロリー・栄養素を合算します。保存後の追加入力は新しい記録になります。</p></section></form><section class="card"><h3>お気に入りから入力</h3><p class="sub">選んだ食事の空いている品目へ入ります。</p><input id="food-search" placeholder="お気に入りの料理名で検索" aria-label="お気に入りを検索"><div id="favorites" class="food-list"></div></section>`;

 $('view').innerHTML=`<section class="card green"><div class="eyebrow">${plan.doneToday?'TODAY COMPLETED':'YOUR NEXT SESSION'}</div><h2>${plan.doneToday?'今日のトレーニングは完了 ✓':plan.due?'今日のトレーニング':'今日は回復の日'}</h2><p class="spaced"><strong>第${plan.session}回 · メニュー${plan.label}</strong><br>${plan.due?'実施日：':'次回の筋トレ予定：'}${plan.date}</p><p class="sub">${plan.due?'実施して完了すると、記録を残して次のメニューへ進みます。':'下には次回メニューを表示しています。今は休養か無理のない軽い歩行に。予定日以降に実施を記録できます。'} 記録日は実際に完了した日です。</p></section><div class="layout"><section class="card"><div class="flex"><h2>${p.place==='gym'?'ジム':'自宅'}の${p.minutes<=15?'短時間':'全身'}プラン</h2><span class="pill">使える時間 ${p.minutes}分</span></div><h3 class="spaced">メニュー${plan.label}</h3><p class="sub">${plan.note} A → B → Cの順に種目や動かし方を変えます。長い時間を選んでも無理に運動量を増やしません。</p><div class="week">${['月','火','水','木','金','土','日'].map(x=>`<div class="day ${plan.days.includes(x)?'on':''}">${x}<br>${plan.days.includes(x)?'筋トレ':plan.walkDays.includes(x)?'歩行':'休息'}</div>`).join('')}</div><p class="hint">開始前は軽く体を動かす。あと2〜3回できる余裕を残し、痛みが出たら中止。初めての器具はスタッフに使い方を確認してください。</p>${plan.list.map((x,i)=>`<div class="exercise"><div class="row"><span class="number">${String(i+1).padStart(2,'0')}</span><h3>${x.name}</h3></div><p class="spaced">${x.reps} × ${x.sets}セット <span class="muted"> / 休息 ${x.rest}</span></p><p class="sub">${x.cue}</p></div>`).join('')}<button id="workout-done" class="full spaced" ${plan.due?'':'disabled'}>${plan.due?'このメニューを完了して次へ進む':'次回 '+plan.date+' から記録できます'}</button></section><div><section class="card"><h3>完了ごとに、次のメニューへ。</h3><p class="sub">週の設定に合わせて次回日を表示します。筋トレの間には最低1日の休養を入れます。予定日を過ぎても自動で完了にはせず、次に実施した日に記録します。以前の運動記録も回数に含めます。</p><p class="sub">1日分の実施は1回だけ保存します。場所や目標を変更しても、同じ日の二重記録はしません。</p><button class="ghost full spaced" data-tab="progress">完了した記録を見る</button><button class="outline full spaced" data-tab="settings">場所・回数を変更</button></section><section class="card"><h3>続けやすさを優先</h3><p class="sub">メニューの変化は飽きずに続けるためのものです。毎回違う種目にすること自体が効果を保証するわけではありません。自宅の器具なし運動は背中への負荷に限界があります。</p></section></div></div>`;

function chart(ws){if(ws.length<2)return empty('2日以上の体重を記録すると、グラフを表示します。');let lo=Math.min(...ws.map(x=>x.value))-1,hi=Math.max(...ws.map(x=>x.value))+1;const start=Date.parse(ws[0].date),span=Date.parse(ws.at(-1).date)-start;const pts=ws.map(x=>[45+(Date.parse(x.date)-start)/span*590,160-(x.value-lo)/(hi-lo)*135]);return `<svg class="chart" viewBox="0 0 680 200" role="img" aria-label="${esc(ws[0].date)}から${esc(ws.at(-1).date)}までの体重推移。下の表に数値を表示。"><path d="M45 25H635 M45 92H635 M45 160H635" fill="none" stroke="#dce2d8" stroke-dasharray="4 5"/><text x="0" y="30" font-size="12" fill="#65756d">${hi.toFixed(1)}</text><text x="0" y="164" font-size="12" fill="#65756d">${lo.toFixed(1)}</text><polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#466f37" stroke-width="3"/>${pts.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="4" fill="#172b25"/>`).join('')}<text x="45" y="190" font-size="12" fill="#65756d">${ws[0].date.slice(5)}</text><text x="600" y="190" font-size="12" fill="#65756d">${ws.at(-1).date.slice(5)}</text></svg>`;}
function progress(){const ws=[...state.weights].sort((a,b)=>a.date.localeCompare(b.date)),last=ws.at(-1),first=ws[0];$('view').innerHTML=`<div class="stat-grid"><div class="card"><small>直近の体重</small><div class="big">${last?.value||'—'}<small> kg</small></div></div><div class="card"><small>初回からの変化</small><div class="big">${last&&first?((last.value-first.value)>0?'+':'')+(last.value-first.value).toFixed(1):'—'}<small> kg</small></div></div><div class="card"><small>筋トレ記録</small><div class="big">${state.workouts.length}<small> 回</small></div></div></div><section class="card spaced"><div class="flex"><h2>体重の推移</h2><span class="pill">直近30記録</span></div>${chart(ws.slice(-30))}<form id="weight-form" class="row"><label>日付<input name="date" type="date" value="${day}" max="${today()}" required></label><label>体重（kg）<input name="value" type="number" min="35" max="250" step="0.1" required placeholder="例：65.2"></label><button type="submit">体重を保存</button></form><p class="sub">同じ日の記録は確認後に更新。朝など、同じ条件で測ると比べやすくなります。</p></section><div class="layout"><section class="card"><h3>体重の履歴</h3><div class="table-wrap"><table><thead><tr><th>日付</th><th>kg</th><th>操作</th></tr></thead><tbody>${[...ws].reverse().slice(0,90).map(w=>`<tr><td>${w.date}</td><td>${w.value}</td><td><button class="tiny danger" data-delete-weight="${w.date}">削除</button></td></tr>`).join('')}</tbody></table></div>${!ws.length?empty('体重の記録はまだありません。'):''}</section><section class="card"><h3>トレーニング履歴</h3>${[...state.workouts].reverse().slice(0,30).map(w=>`<div class="meal"><div><small>${w.date}</small><div class="meal-name">${esc(w.title)}</div><details><summary>実施メニュー</summary><p>${esc(w.detail)}</p></details><button class="tiny danger" data-delete-workout="${w.id}">記録を削除</button></div></div>`).join('')||empty('実施したメニューがここに残ります。')}</section></div>`;$('weight-form').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),w={date:f.get('date'),value:Number(f.get('value'))};if(w.date>today())return toast('未来の日付は使えません。');const save=()=>{if(change(s=>{s.weights=s.weights.filter(x=>x.date!==w.date);s.weights.push(w);})){render();toast('体重を保存しました。');}};state.weights.some(x=>x.date===w.date)?ask('同じ日の体重をこの値に更新しますか？',save):save();};}
function options(vals,current){return vals.map(([v,label])=>`<option value="${v}" ${String(current)===String(v)?'selected':''}>${label}</option>`).join('');}
function settings(){const p=state.profile||{},t=target();$('view').innerHTML=`<section class="card"><div class="flex section-title"><h2>基本設定</h2><span class="pill">18〜78歳の成人向け試作</span></div><form id="profile-form" class="stack"><div class="form-grid"><label>身長（cm）<input name="height" type="number" min="120" max="230" step="0.1" value="${p.height||''}" required></label><label>開始時の体重（kg）<input name="weight" type="number" min="35" max="250" step="0.1" value="${p.weight||''}" required></label><label>年齢<input name="age" type="number" min="18" max="78" step="1" value="${p.age||''}" required></label><label>推定式で使う区分<select name="sex" required><option value="">選択してください</option>${options([['m','男性式'],['f','女性式']],p.sex)}</select></label><label>日常の活動量<select name="activity">${options([[1.2,'座り仕事中心'],[1.375,'軽い運動・歩行あり'],[1.55,'定期的に運動する']],p.activity||1.2)}</select></label><label>目標<select name="goal">${options(Object.entries(Core.goals),p.goal||'maintain')}</select></label><label>目標体重（kg）<input name="target" type="number" min="35" max="250" step="0.1" value="${p.target||''}" required></label><label>トレーニング場所<select name="place">${options([['home','自宅・器具なし'],['gym','ジム・マシンあり']],p.place||'home')}</select></label><label>週の運動回数（筋トレ＋歩行）<select name="days">${options([1,2,3,4,5,6,7].map(n=>[n,'週'+n+'回']),p.days||2)}</select></label><label>1日に使える運動時間<select name="minutes">${options(Core.durations.map(n=>[n,n>=60?`${n/60}時間（${n}分）`:`${n}分`]),p.minutes||20)}</select></label><label>経験<select name="level">${options([['beginner','初めて・再開したばかり'],['experienced','継続している']],p.level||'beginner')}</select></label></div><label class="check"><input name="pain" type="checkbox" ${p.pain?'checked':''}>現在、痛み・ケガがある（筋トレの自動提案を停止）</label><label class="check"><input name="special" type="checkbox" ${p.special?'checked':''}>妊娠・授乳中、摂食障害の治療中、または食事・運動について医療上の指示がある（自動提案を停止し、記録のみ利用）</label><p class="sub">式は全員に適合するものではありません。目標体重は到達時の維持目安への切替に使います。急いで到達するための食事制限は計算しません。</p><button type="submit">設定を保存</button></form>${t&&!t.blocked?`<div class="hint spaced">現在の推定：維持 ${fmt(t.tdee)} kcal ／ 選択目標 ${fmt(t.kcal)} kcal。直近の体重を計算に使います。</div>`:''}</section><section class="card"><h2>iPhoneで使う</h2><p class="sub">Safariの共有メニュー →「ホーム画面に追加」→「追加」。先にこのページを読み込み、下の準備状態を確認してください。記録の移行はバックアップで行えます。</p><p id="offline-status" class="hint spaced">オフライン準備の状態を確認しています…</p><h2 class="spaced">記録のバックアップ</h2><p class="sub">同じ端末・ブラウザに保存します。ブラウザのデータ消去やファイルの移動で記録が見えなくなることがあります。定期的にバックアップしてください。クラウド同期・ログインはありません。</p><div class="row spaced"><button id="export">バックアップを書き出す</button><label class="outline" style="padding:10px;border-radius:10px">バックアップを読み込む<input id="import" type="file" accept=".json,application/json"></label></div>${corrupt?'<button id="raw-export" class="danger spaced">保存されている元データを救出</button>':''}<p class="sub">バックアップには写真・体重・食事などの個人データが入ります。友達にはバックアップではなく、このアプリのHTMLファイルを渡してください。共有端末の同じブラウザでは記録も共有されます。</p><button id="download-app" class="ghost spaced">Mac用HTMLを保存（記録なし）</button></section><section class="card"><h2>計算方法と出典</h2><p class="sub">料理写真は縮小して端末内に保存し、バックアップにも含めます。写真が増えて容量がいっぱいになったら、バックアップ後に不要な写真を削除してください。写真から料理候補を出す試験版があります（101種類・必ず確認）。モデルと実行部品はHugging Face・jsDelivrから取得し、解析は端末内で行います。初回は通信が必要です。モデルのスコアは正解率ではありません。量・カロリーは未解析です。画像送信・有料API・広告・外部への記録送信はありません。食品検索は自分のお気に入り内だけです。</p><details><summary>食事の目安について</summary><p>Mifflin–St Jeorの原式：9.99×体重kg＋6.25×身長cm−4.92×年齢＋166×区分（男性1・女性0）−161。活動係数1.2 / 1.375 / 1.55は本試作の概算設定です。維持から減量は−10%、増量は＋5%という控えめな開始値を置き、1500 kcalまたは推定安静時消費量を下回る目標は出しません。目標到達時は維持の推定値へ切り替えます。到達判定・係数・調整幅・下限は本試作の設計値で、個人の適正摂取量を保証しません。</p><p>P25%・F30%・C45%を仮の配分とし、それぞれ4・9・4 kcal/gで換算します。最適比率ではありません。BMI18.5未満または目標BMI18.5未満の場合は自動目標を出しません。BMIは筋肉量を区別しません。</p><a href="https://pubmed.ncbi.nlm.nih.gov/2305711/" target="_blank" rel="noopener noreferrer">Mifflin et al. (1990) 原著</a><br><a href="https://www.nationalacademies.org/read/27957/chapter/5" target="_blank" rel="noopener noreferrer">National Academies：栄養素の配分範囲</a><br><a href="https://www.niddk.nih.gov/health-information/weight-management/body-weight-planner" target="_blank" rel="noopener noreferrer">NIDDK：成人向け体重管理の対象範囲</a></details><details><summary>トレーニングの考え方</summary><p>健康な成人向けの一般的な運動指針を参考に、全身の筋トレを週1〜3回、追加日は軽い歩行とするA・B・Cのメニューを用意しました。完了した日数で順番に切り替え、筋トレ間には最低1日の休養を入れます。曜日・順番・種目の組合せは本アプリの設計です。種目・回数・休息は本試作の開始例です。筋肉を増やす設定でも、20分や初心者では量を抑えます。医療的なリハビリや競技向けの処方には対応しません。</p><a href="https://www.cdc.gov/physical-activity-basics/guidelines/adults.html" target="_blank" rel="noopener noreferrer">CDC：成人の身体活動</a><br><a href="https://acsm.org/resistance-training-guidelines-update-2026/" target="_blank" rel="noopener noreferrer">ACSM：2026年の筋力トレーニング指針</a></details><details><summary>使い方・無料配布</summary><p>MacではHTMLをChromeやSafariで開いてください。ファイルを友達に渡せます。iPhoneでは公開URLをSafariで開き、共有メニューの「ホーム画面に追加」を選んでください。初回に通信が必要です。「オフライン準備完了」と表示された後は、通信なしでも起動できる構成です。iPhone実機での確認は未完です。ホーム画面版とSafari版で記録が共有されない場合はバックアップを読み込んでください。アプリ本体の取得・更新時は公開先へ通信します。食事・体重の記録を送る処理はありません。出典リンクは外部サイトを開きます。</p><p>この試作の独自コードは無料で使用・改変・再配布できます。無保証。個人記録はアプリ本体に含めずに渡してください。</p></details><small>参考資料確認：2026-10-26 ／ おデブ脱出大作戦 v1.6</small></section>`;
$('profile-form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),n={};for(const k of ['height','weight','age','activity','target','days','minutes'])n[k]=Number(f.get(k));for(const k of ['sex','goal','place','level'])n[k]=f.get(k);n.pain=f.has('pain');n.special=f.has('special');if(!Core.profile(n))return toast('入力の範囲を確認してください。');if(change(s=>s.profile=n)){render();toast('設定を保存しました。');}};
updateOfflineStatus();$('export').onclick=()=>download('karada-backup-'+today()+'.json',JSON.stringify(state,null,2),'application/json');$('import').onchange=importBackup;$('download-app').onclick=()=>download('karada-note.html',APP_SOURCE,'text/html');if($('raw-export'))$('raw-export').onclick=()=>{try{download('karada-original.json',localStorage.getItem(KEY)||'null','application/json');}catch(e){toast('元データを読み出せません。');}};}
function download(name,body,type){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([body],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);}
async function importBackup(e){const f=e.target.files[0];if(!f)return;try{if(f.size>5000000)throw Error('5MB以下のバックアップを選んでください。');const n=Core.migrate(JSON.parse(await f.text()));ask('現在の記録を、選んだバックアップに置き換えます。先に今のバックアップを書き出しましたか？',()=>{if(commit(n)){render();toast('バックアップを読み込みました。');}});}catch(err){toast('読み込みできません：'+err.message);}e.target.value='';}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.removePhoto)return ask('この写真だけを削除しますか？食事の数値は残ります。',()=>{if(change(s=>{delete s.meals.find(x=>x.id===d.removePhoto).photo;}))render();});if(d.clearPhoto!==undefined){delete photoDrafts[day]?.[d.clearPhoto];$('photo-preview-'+d.clearPhoto).innerHTML='';return;}if(d.tab)return go(d.tab);if(d.goal){if(change(s=>s.profile.goal=d.goal)){render();toast('目標を切り替えました。');}return;}if(d.edit){editId=d.edit;food();window.scrollTo(0,0);}if('cancelEdit'in d){editId=null;food();}for(const [key,collection] of [['deleteMeal','meals'],['deleteFood','favorites'],['deleteWorkout','workouts']])if(d[key])ask('この記録を削除しますか？',()=>{if(change(s=>s[collection]=s[collection].filter(x=>x.id!==d[key])))render();});if(d.deleteWeight)ask('この日の体重記録を削除しますか？',()=>{if(change(s=>s.weights=s.weights.filter(x=>x.date!==d.deleteWeight)))render();});if(d.useFood){const f=state.favorites.find(x=>x.id===d.useFood);if(!f)return;const form=$('five-meals'),i=d.foodSlot;const j=[0,1,2,3].find(j=>!['name','amount','kcal','p','f','c'].some(k=>form.elements[i+'-'+j+'-'+k].value!=='')&&!photoDrafts[day]?.[i+'-'+j]);if(j===undefined)return toast('この食事の4品は入力済みです。保存後に追加するか、空欄にしてください。');const key=i+'-'+j;for(const k of ['name','amount','kcal','p','f','c'])form.elements[key+'-'+k].value=f[k]??'';captureMeals();mealPreview();$('meal-section-'+i).scrollIntoView({behavior:'smooth',block:'start'});toast(Core.slots[Number(i)]+'・'+(j+1)+'品目に入力しました。量・カロリーを確認してください。');}});
document.addEventListener('change',e=>{if(e.target.id==='day'&&Core.date(e.target.value)&&e.target.value<=today()){day=e.target.value;editId=null;render();}});

function photoPreview(d,i){const p=photoDrafts[d]?.[i];return p?`<img src="${p}" alt="保存前の料理写真" style="max-width:100%;width:220px;border-radius:12px"><br><button type="button" class="tiny ghost" data-clear-photo="${i}">写真を外す</button>${location.protocol!=='file:'?`<button type="button" class="outline spaced" data-analyze-photo="${i}">写真から料理候補を出す（無料・試験版）</button><button type="button" class="tiny ghost" data-stop-ai>解析を中止</button><div id="ai-result-${i}" class="sub spaced" aria-live="polite">初回は約100MB＋実行部品を取得します。Wi-Fi推奨。写真は端末内で解析。101種類の候補で、日本の家庭料理・複数の料理には弱い場合があります。量・油・カロリーは写真から判定しません。</div>`:''}`:'';}
async function shrinkPhoto(file){
 if(!file.type.startsWith('image/')||file.size>25000000)throw Error('25MB以下の写真を選んでください。');
 const data=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>no(Error('写真を読み込めません。'));r.readAsDataURL(file);});
 const im=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>no(Error('この写真形式を読み込めません。JPEGかPNGで試してください。'));i.src=data;});
 const canvas=document.createElement('canvas');let size=640;
 while(size>=160){const ratio=Math.min(1,size/Math.max(im.naturalWidth,im.naturalHeight));canvas.width=Math.max(1,Math.round(im.naturalWidth*ratio));canvas.height=Math.max(1,Math.round(im.naturalHeight*ratio));const cx=canvas.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,canvas.width,canvas.height);cx.drawImage(im,0,0,canvas.width,canvas.height);const jpg=canvas.toDataURL('image/jpeg',.65);if(jpg.length<=80000)return jpg;size=Math.floor(size*.75);}
 throw Error('写真を小さくできませんでした。別の写真を選んでください。');
}

let foodAI=null,aiJob=null,aiTimer=null;
function aiStatus(job,text){if(day===job.day){const el=$('ai-result-'+job.slot);if(el)el.textContent=text;}}
function stopFoodAI(message){const job=aiJob;if(foodAI)foodAI.terminate();foodAI=null;aiJob=null;clearTimeout(aiTimer);if(job)aiStatus(job,message);}
function analyzePhoto(slot){
 if(aiJob)return toast('1枚ずつ解析しています。終わるまで待つか中止してください。');
 const image=photoDrafts[day]?.[slot];if(!image)return toast('先に料理の写真を追加してください。');
 const job={id:uid(),day,slot,image};aiJob=job;
 aiStatus(job,'AIを準備しています。初回は数分かかる場合があります。');
 try{if(!foodAI){foodAI=new Worker('./food-ai-worker.js',{type:'module'});foodAI.onerror=()=>stopFoodAI('AIを起動できませんでした。通信や端末の対応を確認してください。手入力は使えます。');foodAI.onmessage=({data})=>{
 const j=aiJob;if(!j||data.id!==j.id)return;
 if(data.type==='progress'){aiStatus(j,data.text);return;}
 clearTimeout(aiTimer);aiJob=null;
 if(data.type==='error'){foodAI.terminate();foodAI=null;aiStatus(j,'解析できませんでした。通信・空きメモリを確認して、写真を選び直してください。手入力は使えます。');return;}
 if(day!==j.day||photoDrafts[j.day]?.[j.slot]!==j.image)return;
 const el=$('ai-result-'+j.slot);if(!el)return;
 const rows=Array.isArray(data.result)?data.result.filter(x=>Object.hasOwn(FOOD_NAMES,x.label)&&Number.isFinite(x.score)).slice(0,3):[];
 if(!rows.length||rows[0].score<.3){el.textContent='確かな候補を出せませんでした。料理名・量・カロリーを手入力してください。';return;}
 el.innerHTML='<p>候補です。写真と違う場合は選ばず手入力してください。数値はモデル内の比較スコアで、正解率ではありません。</p>'+rows.map(x=>`<button type="button" class="tiny outline spaced" data-ai-name="${esc(x.label)}" data-ai-slot="${j.slot}">${esc(FOOD_NAMES[x.label])}（${Math.round(x.score*100)}）</button>`).join('')+'<p>料理名だけ入力します。食べた量・カロリーは別に確認してください。自動保存はしません。</p>';
 };}
 aiTimer=setTimeout(()=>stopFoodAI('時間がかかったため中止しました。自動再試行はしません。手入力は使えます。'),240000);
 foodAI.postMessage({id:job.id,image});
 }catch(e){stopFoodAI('この端末ではAIを開始できませんでした。手入力は使えます。');}
}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if('stopAi' in b.dataset){stopFoodAI('解析を中止しました。写真と入力は残しています。');return;}if(b.dataset.analyzePhoto!==undefined){analyzePhoto(b.dataset.analyzePhoto);return;}if(b.dataset.aiName){const name=FOOD_NAMES[b.dataset.aiName],input=$('five-meals')?.elements[b.dataset.aiSlot+'-name'];if(!input||!name)return;const apply=()=>{input.value=name;captureMeals();mealPreview();toast('料理名を入力しました。量・カロリーを確認してください。');};if(input.value.trim()&&input.value!==name)ask('入力中の料理名を候補に置き換えますか？',apply);else apply();}});
